<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Work Tracker"/>
<meta name="theme-color" content="#0f172a"/>
<title>Work Hours Tracker</title>
<link rel="manifest" href="data:application/json,{&quot;name&quot;:&quot;Work Hours Tracker&quot;,&quot;short_name&quot;:&quot;Work Tracker&quot;,&quot;start_url&quot;:&quot;.&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;%230f172a&quot;,&quot;theme_color&quot;:&quot;%230f172a&quot;}"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root {
    --bg: #0f172a;
    --bg2: #1e293b;
    --bg3: #334155;
    --card: #1e293b;
    --border: rgba(148,163,184,0.12);
    --border2: rgba(148,163,184,0.22);
    --text: #f1f5f9;
    --text2: #94a3b8;
    --text3: #64748b;
    --accent: #38bdf8;
    --accent-dim: rgba(56,189,248,0.12);
    --accent-dim2: rgba(56,189,248,0.2);
    --green: #4ade80;
    --green-dim: rgba(74,222,128,0.12);
    --red: #f87171;
    --red-dim: rgba(248,113,113,0.12);
    --amber: #fbbf24;
    --radius: 14px;
    --radius-sm: 9px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100%;
    padding-bottom: 40px;
  }

  /* Header */
  .app-header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px 14px;
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
  }
  .app-title { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
  .app-title span { color: var(--accent); }
  .header-actions { display: flex; gap: 8px; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: var(--radius-sm);
    border: 1px solid var(--border2); background: var(--bg3);
    color: var(--text2); cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; font-size: 16px;
  }
  .icon-btn:active { transform: scale(0.93); background: var(--accent-dim); color: var(--accent); }

  .container { max-width: 600px; margin: 0 auto; padding: 20px 16px 0; }

  /* Summary cards */
  .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
  .metric {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 12px;
    text-align: center;
  }
  .metric-val { font-size: 22px; font-weight: 600; font-family: 'DM Mono', monospace; color: var(--text); line-height: 1; margin-bottom: 4px; }
  .metric-val.green { color: var(--green); }
  .metric-val.accent { color: var(--accent); }
  .metric-lbl { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; }

  /* Mic section */
  .mic-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 24px 20px;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    margin-bottom: 20px;
  }
  .mic-ring {
    width: 80px; height: 80px; border-radius: 50%;
    border: 2px solid var(--border2); background: var(--bg3);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.2s; position: relative;
  }
  .mic-ring:active { transform: scale(0.94); }
  .mic-ring.recording {
    border-color: var(--red);
    background: var(--red-dim);
    animation: mic-pulse 1.2s infinite;
  }
  .mic-ring.recording svg { color: var(--red); }
  @keyframes mic-pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(248,113,113,0.3); }
    50% { box-shadow: 0 0 0 12px rgba(248,113,113,0); }
  }
  .mic-ring svg { width: 32px; height: 32px; color: var(--text2); }
  .mic-hint { font-size: 13px; color: var(--text3); text-align: center; line-height: 1.5; }
  .mic-hint strong { color: var(--text2); font-weight: 500; }

  .transcript-area {
    width: 100%; background: var(--bg3); border: 1px solid var(--border2);
    border-radius: var(--radius-sm); padding: 12px 14px;
    font-size: 14px; color: var(--text); line-height: 1.5;
    min-height: 48px; display: none;
  }
  .transcript-area[contenteditable=true] { outline: none; }
  .transcript-area[contenteditable=true]:focus { border-color: var(--accent); }

  .add-btn {
    width: 100%; padding: 13px; border-radius: var(--radius-sm);
    background: var(--accent); color: #0f172a;
    border: none; font-family: 'DM Sans', sans-serif;
    font-size: 15px; font-weight: 600; cursor: pointer;
    transition: all 0.15s; display: none;
  }
  .add-btn:active { transform: scale(0.97); opacity: 0.9; }
  .add-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Log */
  .section-title {
    font-size: 13px; font-weight: 500; color: var(--text3);
    text-transform: uppercase; letter-spacing: 0.6px;
    margin-bottom: 10px;
  }
  .log-list { display: flex; flex-direction: column; gap: 8px; }

  .entry-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px;
    animation: slide-in 0.25s ease;
  }
  @keyframes slide-in { from { opacity:0; transform: translateY(-8px); } to { opacity:1; transform: translateY(0); } }

  .entry-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .entry-date { font-size: 14px; font-weight: 500; color: var(--text); }
  .entry-day { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 20px; background: var(--accent-dim); color: var(--accent); margin-left: 6px; font-weight: 500; }
  .entry-del {
    width: 28px; height: 28px; border-radius: 7px;
    border: 1px solid var(--border); background: transparent;
    color: var(--text3); cursor: pointer; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; flex-shrink: 0;
  }
  .entry-del:active { background: var(--red-dim); color: var(--red); border-color: var(--red); }

  .entry-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .entry-field { }
  .entry-field-lbl { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 2px; }
  .entry-field-val { font-size: 14px; font-weight: 500; font-family: 'DM Mono', monospace; color: var(--text); }
  .entry-field-val.green { color: var(--green); }
  .entry-time { font-size: 12px; color: var(--text2); margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
  .entry-note { font-size: 12px; color: var(--text2); margin-top: 4px; font-style: italic; }

  .empty {
    text-align: center; padding: 40px 20px;
    color: var(--text3); font-size: 14px; line-height: 1.8;
  }
  .empty svg { width: 40px; height: 40px; margin: 0 auto 12px; display: block; color: var(--bg3); }

  /* Export sheet */
  .export-sheet {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--bg2); border-top: 1px solid var(--border2);
    border-radius: 20px 20px 0 0; padding: 20px 16px 36px;
    transform: translateY(100%); transition: transform 0.3s ease;
    z-index: 200;
  }
  .export-sheet.open { transform: translateY(0); }
  .sheet-handle { width: 40px; height: 4px; border-radius: 2px; background: var(--bg3); margin: 0 auto 18px; }
  .sheet-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; text-align: center; }
  .sheet-btn {
    width: 100%; padding: 15px; border-radius: var(--radius);
    border: 1px solid var(--border2); background: var(--bg3);
    color: var(--text); font-family: 'DM Sans', sans-serif;
    font-size: 15px; font-weight: 500; cursor: pointer;
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 10px; transition: all 0.15s;
  }
  .sheet-btn:active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .sheet-btn svg { width: 20px; height: 20px; flex-shrink: 0; }
  .sheet-cancel {
    width: 100%; padding: 14px; border-radius: var(--radius);
    border: none; background: transparent;
    color: var(--text3); font-family: 'DM Sans', sans-serif;
    font-size: 15px; cursor: pointer; margin-top: 4px;
  }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 150; display: none; }
  .overlay.show { display: block; }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--bg2); border: 1px solid var(--border2);
    color: var(--text); padding: 12px 20px; border-radius: 30px;
    font-size: 14px; font-weight: 500; z-index: 300;
    transition: transform 0.3s ease; white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Install banner */
  .install-banner {
    background: var(--accent-dim); border: 1px solid var(--accent-dim2);
    border-radius: var(--radius); padding: 12px 14px;
    margin-bottom: 20px; display: none;
    font-size: 13px; color: var(--text2); line-height: 1.5;
    align-items: center; gap: 10px;
  }
  .install-banner.show { display: flex; }
  .install-banner svg { width: 18px; height: 18px; color: var(--accent); flex-shrink: 0; }
  .install-close { margin-left: auto; background: none; border: none; color: var(--text3); cursor: pointer; font-size: 18px; padding: 0 0 0 8px; line-height: 1; }

  @media (max-width: 400px) {
    .summary { gap: 7px; }
    .metric-val { font-size: 18px; }
    .entry-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="app-title">Work <span>Tracker</span></div>
  <div class="header-actions">
    <button class="icon-btn" onclick="openExport()" title="Export">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </button>
  </div>
</header>

<div class="container">

  <div class="install-banner" id="installBanner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12" y2="18" stroke-width="3" stroke-linecap="round"/></svg>
    <span id="installText">Add to home screen for the best experience.</span>
    <button class="install-close" onclick="document.getElementById('installBanner').classList.remove('show')">×</button>
  </div>

  <div class="summary">
    <div class="metric">
      <div class="metric-val accent" id="sumHours">0.0</div>
      <div class="metric-lbl">Hours</div>
    </div>
    <div class="metric">
      <div class="metric-val" id="sumUpfront">$0</div>
      <div class="metric-lbl">Upfront</div>
    </div>
    <div class="metric">
      <div class="metric-val green" id="sumTotal">$0</div>
      <div class="metric-lbl">Earned</div>
    </div>
  </div>

  <div class="mic-card">
    <div class="mic-ring" id="micRing" onclick="toggleMic()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="9" y="2" width="6" height="12" rx="3"/>
        <path d="M5 10a7 7 0 0 0 14 0"/>
        <line x1="12" y1="17" x2="12" y2="22"/>
        <line x1="9" y1="22" x2="15" y2="22"/>
      </svg>
    </div>
    <div class="mic-hint" id="micHint">
      <strong>Tap the mic</strong> and speak your work session.<br/>
      e.g. "Today 9 to 5, 8 hours, $300 upfront, $800 total"
    </div>
    <div class="transcript-area" id="transcriptArea"></div>
    <button class="add-btn" id="addBtn" onclick="parseAndAdd()">Add to log</button>
  </div>

  <div class="section-title">Session log</div>
  <div class="log-list" id="logList">
    <div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>
      No sessions yet.<br/>Tap the mic to log your first session.
    </div>
  </div>

</div>

<!-- Export sheet -->
<div class="overlay" id="overlay" onclick="closeExport()"></div>
<div class="export-sheet" id="exportSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">Export your log</div>
  <button class="sheet-btn" onclick="exportPDF()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
    Download as PDF
  </button>
  <button class="sheet-btn" onclick="exportCSV()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg>
    Download as CSV (Excel)
  </button>
  <button class="sheet-cancel" onclick="closeExport()">Cancel</button>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const APIKEY_KEY = 'wt_apikey';
let entries = JSON.parse(localStorage.getItem('wt_entries') || '[]');
let recognition = null, isRecording = false, transcript = '';

const ANTHROPIC_API = 'https://api.anthropic.com/v1/messages';

// On load
renderAll();
showInstallHint();

function saveEntries() { localStorage.setItem('wt_entries', JSON.stringify(entries)); }

// --- Speech ---
function toggleMic() {
  if (!recognition) { initSpeech(); return; }
  if (isRecording) { recognition.stop(); return; }
  transcript = '';
  const ta = document.getElementById('transcriptArea');
  ta.textContent = ''; ta.style.display = 'none';
  document.getElementById('addBtn').style.display = 'none';
  recognition.start();
}

function initSpeech() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    setHint('Type your session below and tap Add to log.');
    const ta = document.getElementById('transcriptArea');
    ta.style.display = 'block'; ta.contentEditable = 'true';
    ta.setAttribute('placeholder','Type here: e.g. Today 9am-5pm, 8 hours, $300 upfront, $800 total');
    document.getElementById('addBtn').style.display = 'block';
    return;
  }
  recognition = new SR();
  recognition.continuous = false; recognition.interimResults = true; recognition.lang = 'en-US';
  recognition.onstart = () => { isRecording = true; document.getElementById('micRing').classList.add('recording'); setHint('Listening… speak now'); };
  recognition.onend = () => {
    isRecording = false; document.getElementById('micRing').classList.remove('recording');
    if (transcript) { setHint('Got it! Tap Add to log.'); document.getElementById('addBtn').disabled = false; }
    else setHint('Nothing heard — try again.');
  };
  recognition.onerror = e => { isRecording = false; document.getElementById('micRing').classList.remove('recording'); setHint('Mic error: ' + e.error + '. Check browser permissions.'); };
  recognition.onresult = e => {
    transcript = Array.from(e.results).map(r => r[0].transcript).join(' ');
    const ta = document.getElementById('transcriptArea');
    ta.textContent = transcript; ta.style.display = 'block';
    document.getElementById('addBtn').style.display = 'block';
  };
  recognition.start();
}

function setHint(t) { document.getElementById('micHint').innerHTML = t; }

// --- Parse with Claude API ---
async function parseAndAdd() {
  const ta = document.getElementById('transcriptArea');
  const text = ta.textContent || ta.innerText || '';
  if (!text.trim()) return;
  const btn = document.getElementById('addBtn');
  btn.disabled = true; btn.textContent = 'Parsing…';

  const today = new Date();
  const prompt = `You are a work hours log parser. The user said: "${text}"
Today is ${today.toDateString()}.
Extract: date (YYYY-MM-DD, infer from "today","yesterday", day names), time (string e.g. "9:00 AM – 5:00 PM"), hours (float), upfront (USD number, 0 if not mentioned), total (USD number, 0 if not mentioned; if hourly rate given calc hours×rate), note (brief work description).
Respond ONLY with valid JSON, no markdown, no extra text:
{"date":"YYYY-MM-DD","time":"string","hours":0,"upfront":0,"total":0,"note":"string"}`;

  try {
    const res = await fetch(ANTHROPIC_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: 'claude-sonnet-4-20250514', max_tokens: 300, messages: [{ role: 'user', content: prompt }] })
    });
    const data = await res.json();
    const raw = data.content.map(i => i.text || '').join('').replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(raw);
    const d = new Date(parsed.date + 'T00:00:00');
    parsed.day = DAYS[d.getDay()];
    entries.unshift(parsed);
    saveEntries(); renderAll();
    ta.style.display = 'none'; ta.textContent = '';
    document.getElementById('addBtn').style.display = 'none';
    setHint('<strong>Session added!</strong> Tap the mic for another.');
    showToast('Session logged ✓');
  } catch(e) {
    showToast('Could not parse — try speaking more clearly');
  }
  btn.textContent = 'Add to log'; btn.disabled = false;
}

// --- Render ---
function renderAll() { renderSummary(); renderLog(); }

function renderSummary() {
  const h = entries.reduce((s,e) => s + parseFloat(e.hours||0), 0);
  const u = entries.reduce((s,e) => s + parseFloat(e.upfront||0), 0);
  const t = entries.reduce((s,e) => s + parseFloat(e.total||0), 0);
  document.getElementById('sumHours').textContent = h.toFixed(1);
  document.getElementById('sumUpfront').textContent = fmtMoney(u);
  document.getElementById('sumTotal').textContent = fmtMoney(t);
}

function renderLog() {
  const el = document.getElementById('logList');
  if (!entries.length) {
    el.innerHTML = `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>No sessions yet.<br/>Tap the mic to log your first session.</div>`;
    return;
  }
  el.innerHTML = entries.map((e, i) => `
    <div class="entry-card">
      <div class="entry-top">
        <div><span class="entry-date">${e.date}</span><span class="entry-day">${(e.day||'').slice(0,3)}</span></div>
        <button class="entry-del" onclick="deleteEntry(${i})">✕</button>
      </div>
      <div class="entry-grid">
        <div class="entry-field"><div class="entry-field-lbl">Hours</div><div class="entry-field-val accent">${parseFloat(e.hours||0).toFixed(1)}h</div></div>
        <div class="entry-field"><div class="entry-field-lbl">Upfront</div><div class="entry-field-val">${fmtMoney(e.upfront||0)}</div></div>
        <div class="entry-field"><div class="entry-field-lbl">Total</div><div class="entry-field-val green">${fmtMoney(e.total||0)}</div></div>
      </div>
      ${e.time ? `<div class="entry-time">⏱ ${e.time}</div>` : ''}
      ${e.note ? `<div class="entry-note">${e.note}</div>` : ''}
    </div>`).join('');
}

function deleteEntry(i) { entries.splice(i,1); saveEntries(); renderAll(); showToast('Entry removed'); }

// --- Export ---
function openExport() {
  if (!entries.length) { showToast('No entries to export yet'); return; }
  document.getElementById('exportSheet').classList.add('open');
  document.getElementById('overlay').classList.add('show');
}
function closeExport() {
  document.getElementById('exportSheet').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

function exportCSV() {
  closeExport();
  const header = 'Date,Day,Time,Hours,Upfront ($),Total ($),Note';
  const rows = entries.map(e => [e.date, e.day||'', '"'+(e.time||'')+'"', parseFloat(e.hours||0).toFixed(1), parseFloat(e.upfront||0).toFixed(2), parseFloat(e.total||0).toFixed(2), '"'+(e.note||'')+'"'].join(','));
  const h = entries.reduce((s,e)=>s+parseFloat(e.hours||0),0);
  const u = entries.reduce((s,e)=>s+parseFloat(e.upfront||0),0);
  const t = entries.reduce((s,e)=>s+parseFloat(e.total||0),0);
  rows.push(['TOTAL','','',h.toFixed(1),u.toFixed(2),t.toFixed(2),''].join(','));
  const csv = [header,...rows].join('\n');
  const blob = new Blob([csv],{type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='work_hours_'+today()+'.csv'; a.click();
  URL.revokeObjectURL(url);
  showToast('CSV downloaded');
}

function exportPDF() {
  closeExport();
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  doc.setFillColor(15,23,42); doc.rect(0,0,210,297,'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(22); doc.setTextColor(241,245,249);
  doc.text('Work Hours Report',14,22);
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(100,116,139);
  doc.text('Generated: '+new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}),14,30);
  const h=entries.reduce((s,e)=>s+parseFloat(e.hours||0),0);
  const u=entries.reduce((s,e)=>s+parseFloat(e.upfront||0),0);
  const t=entries.reduce((s,e)=>s+parseFloat(e.total||0),0);
  doc.setFontSize(11); doc.setTextColor(148,163,184);
  doc.text(`Total hours: ${h.toFixed(1)}h     Upfront: $${u.toFixed(2)}     Earned: $${t.toFixed(2)}`,14,40);
  doc.autoTable({
    startY:48,
    head:[['Date','Day','Time','Hours','Upfront','Total','Note']],
    body:entries.map(e=>[e.date,e.day||'',e.time||'-',parseFloat(e.hours||0).toFixed(1)+'h','$'+parseFloat(e.upfront||0).toFixed(2),'$'+parseFloat(e.total||0).toFixed(2),e.note||'']),
    foot:[['TOTAL','','',h.toFixed(1)+'h','$'+u.toFixed(2),'$'+t.toFixed(2),'']],
    headStyles:{fillColor:[30,41,59],textColor:[148,163,184],fontStyle:'bold',fontSize:9},
    bodyStyles:{fillColor:[30,41,59],textColor:[241,245,249],fontSize:9},
    alternateRowStyles:{fillColor:[51,65,85]},
    footStyles:{fillColor:[56,189,248],textColor:[15,23,42],fontStyle:'bold',fontSize:9},
    styles:{cellPadding:4},
    columnStyles:{5:{fontStyle:'bold',textColor:[74,222,128]}}
  });
  doc.save('work_hours_'+today()+'.pdf');
  showToast('PDF downloaded');
}

// --- Helpers ---
function fmtMoney(n) { return '$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2}); }
function today() { return new Date().toISOString().slice(0,10); }
function showToast(msg) {
  const t = document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// --- Install hint ---
function showInstallHint() {
  const ua = navigator.userAgent;
  const banner = document.getElementById('installBanner');
  const txt = document.getElementById('installText');
  const isIOS = /iphone|ipad|ipod/i.test(ua);
  const isAndroid = /android/i.test(ua);
  const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
  if (isStandalone) return;
  if (isIOS) { txt.textContent = 'Add to Home Screen: tap Share → "Add to Home Screen"'; banner.classList.add('show'); }
  else if (isAndroid) { txt.textContent = 'Install as app: tap ⋮ menu → "Add to Home screen"'; banner.classList.add('show'); }
}
</script>
